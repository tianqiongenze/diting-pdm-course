# 上游 Diting-PdM → 课程仓库 的同步映射
#
# 规则：
#   1. 上游任何文件变更，先在这里找到「影响哪些课程位置」，再同步内容；
#   2. 没有映射的上游变更（unmapped）不忽略，需在 PROJECT_UPDATES.md 里人工判断；
#   3. 映射是「责任人提示」，不是自动改写——自动改写只覆盖 AUTO-SNAPSHOT 区块。

version: 1
upstream:
  path: ../Diting-PdM
  repo: https://github.com/tianqiongenze/diting-pdm
  mirror: https://gitee.com/enze_tian_qiong/diting-pdm

# 关键事实快照：这些数字一变，全课程引用都要跟着变
facts:
  unit_tests:
    pattern: '(\d{3})\s*单测'
    sources: ["README.md", "docs/46_先进技术落地交付报告.md"]
    targets: ["01_课程标准.md", "11_项目案例库与代码导览.md", "slides/src/content_m4.py"]
  browser_tests:
    pattern: '(\d{3})\s*浏览器'
    sources: ["README.md", "docs/46_先进技术落地交付报告.md"]
    targets: ["01_课程标准.md", "11_项目案例库与代码导览.md"]
  doc_count:
    pattern: 'COUNT_DOCS'
    sources: ["docs"]
    targets: ["00_课程总览.md", "11_项目案例库与代码导览.md"]
  image_version:
    pattern: '镜像\s*(\d+\.\d+\.\d+)'
    sources: ["README.md", "docs/46_先进技术落地交付报告.md"]
    targets: ["11_项目案例库与代码导览.md"]

